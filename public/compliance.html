<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Screening API — demo</title>
<style>
 :root{--ink:#16191d;--dim:#5f6a75;--line:#e0e4e9;--go:#1a7f4b;--stop:#b3261e;--amber:#a4600a;
       --ours:#1a2634;--theirs:#8e97a1}
 *{box-sizing:border-box}
 body{margin:0;background:#f5f7f9;color:var(--ink);
      font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,sans-serif;
      display:flex;justify-content:center;padding:32px 18px 90px}
 main{width:100%;max-width:780px}
 h1{font-size:26px;margin:0 0 4px;letter-spacing:-.02em}
 .sub{color:var(--dim);margin:0 0 24px;font-size:15px}
 .zone{border-radius:15px;padding:15px;margin-bottom:16px}
 .zone.ours{background:#eef2f6;border:2px solid var(--ours)}
 .zone.theirs{background:#fafbfc;border:2px dashed #c4ccd4}
 .ztag{font-size:11px;text-transform:uppercase;letter-spacing:.1em;font-weight:700;
       padding:0 4px 11px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
 .zone.ours .ztag{color:var(--ours)}
 .zone.theirs .ztag{color:var(--theirs)}
 .ztag em{font-style:normal;font-weight:500;letter-spacing:0;text-transform:none;font-size:12.5px}
 .card{background:#fff;border:1px solid var(--line);border-radius:11px;padding:18px;margin-bottom:11px}
 .card:last-child{margin-bottom:0}
 .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--dim);margin-bottom:9px}
 button{font:inherit;font-weight:640;border:0;border-radius:9px;padding:12px 20px;cursor:pointer}
 .p{background:var(--ours);color:#fff}
 .g{background:#fff;border:2px solid var(--line);color:var(--dim);padding:10px 16px}
 .clear{background:var(--go);color:#fff}.esc{background:var(--stop);color:#fff}
 .row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
 .kv{display:flex;justify-content:space-between;padding:6px 0;font-size:15px;gap:14px}
 .kv span:first-child{color:var(--dim)}
 .kv b{text-align:right;word-break:break-word}
 table{width:100%;border-collapse:collapse;font-size:15px;margin-top:4px}
 th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.08em;
    color:var(--dim);font-weight:600;padding:7px 8px;border-bottom:1px solid var(--line)}
 td{padding:9px 8px;border-bottom:1px solid #eef1f4;vertical-align:top}
 tr.no td{background:#fff6f5}
 .tag{font-size:12px;font-weight:700;padding:2px 8px;border-radius:20px;white-space:nowrap}
 .tag.y{background:#e6f4ec;color:var(--go)}.tag.n{background:#fdeceb;color:var(--stop)}
 .tag.p{background:#fdf3e3;color:#a4600a}.tag.u{background:#eef1f4;color:var(--dim)}
 .fnote{display:block;font-size:11px;color:var(--dim);margin-top:2px;font-weight:400}
 .banner{border-radius:10px;padding:13px 15px;font-size:15.5px;font-weight:600;margin-bottom:11px}
 .banner.ok{background:#e6f4ec;color:#12603a}
 .banner.warn{background:#fdf3e3;color:var(--amber)}
 .banner.stop{background:#fdeceb;color:var(--stop)}
 .note{font-size:13px;color:var(--dim);margin-top:10px;font-weight:400;line-height:1.5}
 .cost{display:flex;justify-content:space-between;font-size:14px;padding:7px 0;
       border-bottom:1px solid #eef1f4;color:var(--dim)}
 .cost:last-child{border:0}
 code{font:12.5px ui-monospace,Menlo,monospace;background:#eef2f6;padding:1px 5px;border-radius:4px}
 a{color:#1858c4}
 .big{font-size:21px;font-weight:700;letter-spacing:-.01em}
</style></head><body><main>
<h1>Sanctions screening API</h1>
<p class="sub">We return a match result. What the customer does with it is their system, not ours.</p>

<div class="card">
 <div class="lbl">Customer sends a subject to screen</div>
 <div class="row">
  <button class="p" id="b-clean">Screen &mdash; M. Santos Oliveira</button>
  <button class="p" id="b-hit">Screen &mdash; V. Petrov</button>
  <button class="g" id="b-reset">Reset</button>
  <a href="/audit"><button class="g">Audit trail</button></a>
 </div>
</div>

<div id="stage"></div>

<div class="card">
 <div class="lbl">What the customer paid us</div>
 <div id="ledger" class="note">Nothing yet.</div>
</div>
</main>
<script>
const $=(i)=>document.getElementById(i);
const c=(n)=>(n*100).toFixed(n*100<1?1:0)+"\u00A2";
const post=(u,b)=>fetch(u,{method:"POST",headers:{"Content-Type":"application/json"},
                           body:JSON.stringify(b||{})}).then(r=>r.json());
let cur=null;

function ledger(l){
 $("ledger").innerHTML=l.lines.length
  ? l.lines.map(x=>'<div class="cost"><span>'+x.label+'</span><span>'+c(x.price)
      +' \u00B7 '+x.ms+' ms'+(x.tx?' \u00B7 <a target="_blank" href="https://sepolia.basescan.org/tx/'
      +x.tx+'">tx</a>':'')+'</span></div>').join('')
    +'<div class="cost" style="color:#16191d;font-weight:700"><span>Total</span><span>'
      +c(l.spent)+'</span></div>'
  : "Nothing yet.";
}

function ours(inner){
 return '<div class="zone ours"><div class="ztag"><span>What we return</span>'
  +'<em>our product &mdash; priced per check</em></div>'+inner+'</div>';
}
function theirs(inner){
 return '<div class="zone theirs"><div class="ztag"><span>Customer\u2019s own system</span>'
  +'<em>illustrative &mdash; not part of our service</em></div>'+inner+'</div>';
}

function checkCard(r,s){
 return '<div class="card"><div class="lbl">Check record</div>'
 +'<div class="kv"><span>Reference</span><b><code>'+r.reference+'</code></b></div>'
 +'<div class="kv"><span>Performed at</span><b>'+new Date(r.performed_at).toISOString()+'</b></div>'
 +'<div class="kv"><span>Subject screened</span><b>'+r.subject_name
   +(r.subject_dob?' \u00B7 '+r.subject_dob:'')+'</b></div>'
 +'<div class="kv"><span>Lists</span><b>'+s.listsChecked.join(", ")+'</b></div>'
 +'<div class="kv"><span>List version</span><b><code>'+r.list_version+'</code></b></div>'
 +'<div class="kv"><span>Record hash</span><b><code>'+r.record_hash.slice(0,22)+'\u2026</code></b></div>'
 +'</div>';
}

function resultCard(s){
 return '<div class="card"><div class="lbl">Result returned</div>'
 +'<div class="kv"><span>Matches</span><b>'+s.hitCount+'</b></div>'
 +(s.hitCount?'<div class="kv"><span>Listed party</span><b>'+s.hits[0].name+'</b></div>'
   +'<div class="kv"><span>Source list</span><b>'+s.hits[0].list+'</b></div>'
   +'<div class="kv"><span>Match score</span><b>'+s.hits[0].score+'</b></div>':'')
 +'<div class="note">We return whether the subject matches and on what basis. '
 +'We do not assess, recommend, or decide.</div></div>';
}

const STATUS_TAG={match:['y','agrees'],partial:['p','partial'],differs:['n','differs'],unknown:['u','no data']};
function comparisonCard(x){
 const rows=x.fields.map(f=>{
   const st=f.status||(f.agree?'match':'differs');
   const [cls,label]=STATUS_TAG[st]||STATUS_TAG.unknown;
   return '<tr class="'+(st==='differs'?'no':'')+'"><td>'+f.field+'</td><td>'
    +f.subject+'</td><td>'+f.listed+'</td><td><span class="tag '+cls+'">'+label+'</span>'
    +(f.note?'<span class="fnote">'+f.note+'</span>':'')+'</td></tr>';
 }).join('');
 return '<div class="card"><div class="lbl">Field comparison</div>'
 +'<table><tr><th>Field</th><th>Subject supplied</th><th>Listed party</th><th></th></tr>'+rows+'</table>'
 +'<div class="note">'+x.meta.list+' '+x.meta.listVersion+' \u00B7 '+x.meta.program
 +' \u00B7 '+x.meta.uid+' \u00B7 matched on: '+x.meta.matchedOn+'<br>'
 +'Deterministic field-by-field comparison. No model output, no inference.</div></div>';
}

function paymentCard(p){
 return '<div class="card"><div class="lbl">Their pending payment</div>'
 +'<div class="kv"><span>Reference</span><b>'+p.ref+'</b></div>'
 +'<div class="kv"><span>Counterparty</span><b>'+p.vendor+'</b></div>'
 +'<div class="kv"><span>Amount</span><b>'+p.amount+'</b></div>'
 +'<div class="kv"><span>Purpose</span><b>'+p.purpose+'</b></div></div>';
}

function decisionCard(r){
 return '<div class="card"><div class="lbl">Their disposition</div>'
 +'<div class="row"><button class="clear" id="d-clear">Clear the alert</button>'
 +'<button class="esc" id="d-esc">Escalate</button></div>'
 +'<div class="note">Their reviewer decides. We record the disposition against check '
 +'<code>'+r.reference+'</code> so it appears in their audit trail.</div></div>';
}

async function run(id){
 $("stage").innerHTML='<div class="card">Screening\u2026</div>';
 const r=await post("/api/run",{id});
 if(!r.ok){$("stage").innerHTML='<div class="card">'+r.error+'</div>';return;}
 cur=r; ledger(r.ledger);

 if(r.outcome==="clear"){
  $("stage").innerHTML=ours('<div class="banner ok">No match returned.</div>'
    +checkCard(r.record,r.screen)+resultCard(r.screen))
   +theirs(paymentCard(r.payment));
  return;
 }

 $("stage").innerHTML=ours('<div class="banner warn">Possible match returned \u2014 1 record.</div>'
   +checkCard(r.record,r.screen)+resultCard(r.screen)+comparisonCard(r.context))
  +theirs(paymentCard(r.payment)+decisionCard(r.record));
 $("d-clear").onclick=()=>decide(true);
 $("d-esc").onclick=()=>decide(false);
}

async function decide(cleared){
 const p=cur.payment, rec=cur.record;
 const d=await post("/api/dispose",{reference:rec.reference,
                    disposition:cleared?"cleared":"escalated"});
 $("stage").innerHTML=ours('<div class="banner ok">Check complete. Disposition recorded.</div>'
   +checkCard(rec,cur.screen)+resultCard(cur.screen)+comparisonCard(cur.context)
   +'<div class="card"><div class="lbl">Disposition recorded</div>'
   +'<div class="kv"><span>Check</span><b><code>'+rec.reference+'</code></b></div>'
   +'<div class="kv"><span>Outcome</span><b>'+(cleared?'cleared':'escalated')+'</b></div>'
   +'<div class="kv"><span>Recorded at</span><b>'
     +(d.record?new Date(d.record.disposed_at).toISOString():'now')+'</b></div>'
   +'<div class="note">Their decision, stored against our check reference. '
   +'The record hash covers the check facts only \u2014 not the disposition.</div></div>')
  +theirs(paymentCard(p));
}

$("b-clean").onclick=()=>run("clean");
$("b-hit").onclick=()=>run("hit");
$("b-reset").onclick=async()=>{ledger(await post("/api/reset"));$("stage").innerHTML="";cur=null;};
fetch("/api/ledger").then(r=>r.json()).then(ledger);
</script></body></html>
